# A season loses to a holiday and to a file in days/.
# First matching entry wins. A season that would only be warm white is left out.
#
# Christmas is December 1 through January 1. December 25 is still the holiday:
# white and gold from midnight until the next midnight, then this season returns.
# Fall is October 1 through November 30, the night before that season starts.
# brightness falls through when omitted. Christmas season sets 100. The others use default.yaml.

- name: Lent
  start: {easter: -46}
  end: {easter: -1}
  colors:
    - [102, 0, 153]

- name: Eastertide
  start: {easter: 1}
  end: {easter: 48}
  colors:
    - [255, 255, 255]
    - [255, 215, 0]

- name: Fall
  start: {month: 10, day: 1}
  end: {month: 11, day: 30}
  colors:
    - [176, 32, 24]
    - [196, 78, 18]
    - [214, 120, 28]
    - [140, 72, 24]

- name: Christmas season
  start: {month: 12, day: 1}
  end: {month: 1, day: 1}
  brightness: 100
  colors:
    - [255, 0, 0]
    - [0, 255, 0]
    - [0, 0, 255]
    - [255, 165, 0]
