# First matching entry wins. Movable dates are first so they beat a fixed
# date on the same civil day. prior_night and midnight default to false.
# brightness is 100. Omit it and the number falls through to the season, then default.yaml.
# easter: 0 is Easter Sunday. A negative offset counts back from that Sunday.
# nth is 1-5 or last, together with weekday.

- name: Palm Sunday
  easter: -7
  brightness: 100
  colors:
    - [255, 0, 0]
    - [0, 128, 0]

- name: Good Friday
  easter: -2
  brightness: 100
  colors:
    - [153, 0, 0]

- name: Easter
  easter: 0
  prior_night: true
  brightness: 100
  colors:
    - [255, 255, 255]
    - [255, 215, 0]

