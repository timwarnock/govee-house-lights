[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "house-lights"
version = "0.1.0"
description = "Local CLI for Govee Permanent Outdoor Lights Pro (H706C): LAN UDP and Bluetooth."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [{name = "Tim Warnock"}]
dependencies = [
    "govee-ble-local==1.10.0",
    "bleak==3.0.2",
    "bleak-retry-connector==4.7.1",
    "cryptography==50.0.2",
    "kaitaistruct==0.11",
    "astral==3.2",
]

[project.scripts]
house-lights = "house_lights.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
